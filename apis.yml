name: RealScout
description: >-
  RealScout is a lead-nurture and collaborative home-search platform for real
  estate professionals — agents, teams, and brokerages — that turns an agent's
  existing database and local MLS inventory into a recurring source of
  transactions. It is CRM-agnostic and plugs into existing stacks (Follow Up
  Boss, Sierra, Salesforce, HubSpot) via native integrations, Zapier/Make, and
  direct API access on Enterprise plans. Core products include AI Search
  (natural-language-to-MLS-criteria), Scout Score (0–100 contact engagement
  scoring), Contact Enrichment, Search Links, and Auto-Nurture alerts. RealScout
  publishes an OAuth 2.1-protected, standards-compliant MCP server
  (api://realscout-admin-mcp) for agent/AI access. Backed by DCM Ventures.
